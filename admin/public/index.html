<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galerie · správa</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <header class="top">
    <div class="brand">Galerie <span>správa</span></div>
    <div class="top-right">
      <span class="save-state" id="save-state"></span>
      <span class="git-state" id="git-state"></span>
      <span class="repo-size" id="repo-size"></span>
      <a class="btn ghost" href="/preview/" target="gallery-preview">Náhled webu ↗</a>
      <button class="btn confirm" id="confirm-btn" hidden title="Zveřejní všechny koncepty. Na GitHub pak odejdou tlačítkem Publikovat.">Potvrdit nové fotky (<span id="n-confirm">0</span>)</button>
      <button class="btn primary" id="publish-btn">Publikovat na GitHub</button>
    </div>
  </header>

  <div class="layout">
    <aside class="side">
      <button class="side-item" data-filter="settings" id="nav-settings">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5Z"/></svg>
        Profil a nastavení
      </button>
      <div class="side-title">Fotky</div>
      <button class="side-item" data-filter="all">Všechny <span class="n" id="n-all"></span></button>
      <button class="side-item" data-filter="none">Bez kolekce <span class="n" id="n-none"></span></button>
      <button class="side-item" data-filter="drafts">Koncepty <span class="n" id="n-drafts"></span></button>
      <div class="side-title">
        Kolekce
        <button class="mini" id="add-collection" title="Nová kolekce">+ nová</button>
      </div>
      <div id="coll-list"></div>
    </aside>

    <main class="main" id="main">
      <div class="main-head">
        <div>
          <h1 id="view-title">Všechny fotky</h1>
          <div class="sub" id="view-sub"></div>
          <div class="order-state" id="order-state"></div>
        </div>
        <div class="main-actions">
          <button class="btn ghost small" id="edit-collection" hidden>Upravit kolekci</button>
          <button class="btn ghost small" id="select-all">Vybrat vše</button>
        </div>
      </div>

      <label class="drop" id="drop">
        <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.webp,.tif,.tiff,image/*" hidden>
        <svg viewBox="0 0 24 24"><path d="M11 16V7.8l-3.6 3.6L6 10l6-6 6 6-1.4 1.4L13 7.8V16h-2Zm-6 4v-5h2v3h10v-3h2v5H5Z"/></svg>
        <div>
          <b>Přetáhni fotky sem</b> nebo klikni pro výběr
          <div class="sub" id="drop-hint">JPG, PNG, WebP, TIFF · originály zůstávají u tebe, na web jde jen zmenšená verze</div>
        </div>
      </label>
      <div class="queue" id="queue" hidden></div>

      <div class="thumbs" id="thumbs"></div>
      <p class="empty" id="empty" hidden></p>
    </main>

    <aside class="panel" id="panel"></aside>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="/admin.js"></script>
</body>
</html>
